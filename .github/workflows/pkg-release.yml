# =============================================================================
# Release
# =============================================================================
# Manually-triggered workflow that builds the package's RPM(s) and publishes
# them to JFrog Artifactory.
#
# Required configuration:
#   vars.CACHE_BASE_URL - Base URL of the lookaside cache (Actions variable).
#   secrets.QSC_API_KEY - QSC API key used to obtain an Artifactory token.
#
# See docs/workflows.md for the full documentation.
# =============================================================================
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: qualcomm-linux/qcom-rpm-utils/.github/workflows/pkg-release-reusable-workflow.yml@main
    with:
      qcom-rpm-utils-ref: main
      cache-base-url: ${{ vars.CACHE_BASE_URL }}
      server-url: https://qartifactory.qualcomm.com
    secrets:
      QSC_API_KEY: ${{ secrets.QSC_API_KEY }}
